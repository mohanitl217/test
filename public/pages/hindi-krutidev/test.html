<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>हिंदी (KrutiDev) · Typing Test</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/base.css" />
  <link rel="stylesheet" href="../../css/test.css" />
  <link rel="stylesheet" href="../../css/hindi-krutidev.css" />
</head>
<body class="theme-krutidev-page">
  <nav class="nav">
    <div class="nav-inner">
      <a href="../../index.html" class="brand"><span class="brand-mark">अ</span>TypeMaster</a>
      <div class="nav-links">
        <a href="../../index.html">Home</a>
        <a href="learn.html">← अभ्यास</a>
      </div>
    </div>
  </nav>

  <main class="test-shell">
    <div class="test-head">
      <div>
        <h1>हिंदी टाइपिंग परीक्षा <span class="layout-badge" style="background:#fef3c7;color:#92400e;">KrutiDev / DevLys</span></h1>
        <div class="duration-picker" style="margin-top:8px;">
          <button data-dur="60">1 min</button>
          <button class="active" data-dur="300">5 min</button>
          <button data-dur="600">10 min</button>
        </div>
      </div>
      <div class="lesson-pick">
        <label class="label" style="margin:0;">गद्यांश:</label>
        <select id="lesson-select"></select>
      </div>
    </div>

    <div class="stats-bar">
      <div class="stat"><div class="num" id="stat-wpm">0</div><div class="lbl">WPM</div></div>
      <div class="stat"><div class="num" id="stat-acc">100%</div><div class="lbl">शुद्धता</div></div>
      <div class="stat danger"><div class="num" id="stat-err">0</div><div class="lbl">त्रुटियाँ</div></div>
      <div class="stat warn"><div class="num" id="stat-time">300s</div><div class="lbl">शेष समय</div></div>
    </div>

    <div class="test-card">
      <div id="target" class="target-text"></div>
      <input id="input" class="typing-input" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="यहाँ क्लिक करें और टाइप करना शुरू करें…" />
      <div class="controls">
        <button id="restart-btn" class="btn">पुनः आरम्भ</button>
        <button id="start-btn" class="btn btn-solid">Focus input</button>
        <a href="learn.html" class="btn">अभ्यास पर वापस</a>
      </div>
    </div>
  </main>

  <div id="result-modal" class="result-modal">
    <div class="result-card">
      <h2>परीक्षा समाप्त</h2>
      <div class="big" id="result-wpm">0</div>
      <div style="color:var(--text-muted);font-weight:600;">शब्द प्रति मिनट</div>
      <div class="row">
        <div><strong id="result-acc">0%</strong><span>शुद्धता</span></div>
        <div><strong id="result-err">0</strong><span>त्रुटियाँ</span></div>
        <div><strong>5 chars</strong><span>= 1 word</span></div>
      </div>
      <button id="result-close" class="btn btn-solid" style="width:100%;">पूर्ण</button>
    </div>
  </div>

  <script>window.TEST_CONFIG = { section: 'hindi-krutidev', mode: 'test' };</script>
  <script src="../../js/api.js"></script>
  <script src="../../js/test.js"></script>
</body>
</html>
