<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mangal · INSCRIPT · Learn</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/base.css" />
  <link rel="stylesheet" href="../../css/learn.css" />
  <link rel="stylesheet" href="../../css/hindi-mangal.css" />
</head>
<body class="theme-mangal-page layout-inscript">
  <nav class="nav">
    <div class="nav-inner">
      <a href="../../index.html" class="brand"><span class="brand-mark">अ</span>TypeMaster</a>
      <div class="nav-links">
        <a href="../../index.html">Home</a>
        <a href="inscript-test.html">Take Test →</a>
      </div>
    </div>
  </nav>

  <main class="exercise-shell">
    <div class="exercise-head">
      <div>
        <h1>हिंदी टाइपिंग — Learn <span class="layout-badge inscript">INSCRIPT</span></h1>
        <div class="subtitle">Government-standard INSCRIPT layout · Mangal Unicode font.</div>
      </div>
      <div class="lesson-pick">
        <label class="label" style="margin:0;">पाठ:</label>
        <select id="lesson-select"></select>
        <span class="label" style="margin:0;">शुद्धता: <span id="accuracy" style="color:var(--brand);font-weight:700;">100%</span></span>
      </div>
    </div>

    <div class="learn-card">
      <div class="progress-bar"><span id="progress-bar"></span></div>
      <div id="target" class="target-text"></div>
      <input id="input" class="typing-input" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="यहाँ टाइप करें…" />
      <div class="next-key-hint">
        <span class="key" id="next-key">अ</span>
        <span class="label">अगला अक्षर / Next character</span>
      </div>
      <div class="controls">
        <button id="reset-btn" class="btn">पुनः आरम्भ</button>
        <a href="inscript-test.html" class="btn btn-solid">परीक्षा दें →</a>
      </div>
    </div>
  </main>

  <script>window.LEARN_CONFIG = { section: 'hindi-mangal-inscript', mode: 'learn' };</script>
  <script src="../../js/api.js"></script>
  <script src="../../js/learn.js"></script>
</body>
</html>
